:root[data-theme="dark"]{--bg:#14120f;--sf:#1e1b17;--tx:#f1ede4;--mu:#a39b8c;--ln:#332e27;--ac:#fb923c;--as:#2c1f15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,serif}
.w{max-width:760px;margin:0 auto;padding:16px 16px 48px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;border-bottom:1px solid var(--ln);font:14px system-ui,sans-serif}
nav a{white-space:nowrap;padding:6px 12px;border-radius:999px;color:var(--mu);text-decoration:none}
nav a.on{background:var(--as);color:var(--ac);font-weight:600}
h1{font-size:28px;margin:26px 0 6px}
h2{font-size:17px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ln)}
.mu{color:var(--mu);font:14px system-ui,sans-serif}
.btn{display:inline-block;margin-top:12px;padding:11px 18px;background:var(--ac);color:var(--bg);border-radius:10px;text-decoration:none;font:600 15px system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid a{display:block;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;color:var(--tx);text-decoration:none;font:15px system-ui,sans-serif}
.grid a:hover{border-color:var(--ac);color:var(--ac)}
.s{width:100%;margin:12px 0 0;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:16px system-ui,sans-serif}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.c b{display:block}.c span{font:14px/1.5 system-ui,sans-serif;color:var(--mu)}
.t{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--as);color:var(--ac);font:600 12px system-ui,sans-serif}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--ln)}
</style>

,'cla-akimichi':{n:'Clã Akimichi 🍡',d:'A família dos “gordinhos sensação” é um clã de importância em Konoha, um dos combatentes mais poderosos por desenvolver um estilo de luta massivo e com potencial de destruição incalculável.',s:[['Habilidades',['• Força Bruta','• Resistência Elevada','• Chakra Elevado','• Controle de Chakra','• Vigor Elevado','• Controle de Calorias [Massa]','• Recuperação de Chakra por Comida [+15pts]','• Três Pílulas Coloridas']]]},
'cla-might':{n:'Clã Might 👊',d:'O clã das bestas é uma linhagem quase amaldiçoada: nenhum membro consegue transformar chakra o bastante para formar elementos da natureza, ninjutsu ou genjutsu. Em troca, têm feitos físicos assustadoramente únicos, e só eles atingem o auge dos oito portões.',s:[['Habilidades',['• Força Bruta [4.0x]','• Velocidade elevada [4.0x]','• Reflexo elevado [4.0x]','• Resistência Elevada [4.0x]','• Maestria em Taijutsu','• Maestria em Bukijutsu','• Deficiência [Usa ninjutsu rank D menos]','• Vitalidade anormal','• Ninja esforçado']]]},
'cla-kaguya':{n:'Clã Kaguya 💀',d:'Conhecido por integrantes de características únicas e por um estilo de luta selvagem. Também serve a um tipo de Deusa, herdando suas habilidades.',s:[['Habilidades',['• Força Bruta','• Velocidade elevada','• Reflexo elevado','• Resistência elevada','• Maestria em Taijutsu','• Controle de Chakra','• Imunidade a Dor','• K.K.G: Shikotsumyaku']],['Kekkei Genkai · Shikotsumyaku',['A Veia Óssea do Cadáver é uma kekkei genkai quase extinta e complexa. Manipula o cálcio dos ossos com chakra, permitindo moldar a estrutura esquelética à vontade. Concentrar chakra aumenta a rigidez, destreza e durabilidade, e permite criar armas e escudos mais fortes que o aço. As técnicas costumam ser combinadas com um estilo de luta semelhante a uma “dança”.']]]},
'cla-kidomaru':{n:'Clã Kidomaru 🕸️',d:'Possui genética totalmente diferente do comum, com seis braços e três olhos. São peritos em batalhas à longa distância, com uma hiden que manipula teias altamente resistentes.',s:[['Habilidades',['• Força Bruta','• Reflexo Elevado','• Maestria em Taijutsu','• Maestria em Ninjutsu','• Kanchi Taipu','• Chakra Elevado','• Sentidos Apurados [Visão]','• Características Animalescas [Aranha]','• Técnica de Criação de Teias','• Genialidade']]]}
,'cla-hoshigake':{n:'Clã Hoshigake 🦈',d:'Clã de mercenários de Kirigakure com características animalescas de tubarão: guelras, dentes serrilhados e pele azulada. Conseguem respirar debaixo d’água e têm grande reserva de chakra por sua genética híbrida.',s:[['Habilidades',['• Força Bruta','• Velocidade Elevada','• Maestria em Ninjutsu','• Maestria em Bukijutsu [Kenjutsu]','• Chakra Elevado [3x]','• Vigor Elevado','• Prodígio Elemental [Suiton]','• Características Animalescas [Tubarão]']]]},
'cla-a':{n:'Clã A 🌩️',d:'O clã do Raikage é conhecido pelo porte físico e poder estrondoso, com uma técnica dos ancestrais e ninjutsu notável. Tem uma genética abençoada que aumenta naturalmente a capacidade física e aprimora as habilidades em combate.',s:[['Habilidades',['• Força Bruta','• Velocidade Elevada','• Reflexo Elevado','• Resistência Elevada','• Maestria em Taijutsu','• Chakra Elevado','• Vitalidade Anormal','• Genes do Raikage [1/4]','• Raiton no Yoroi [Jounin]','• Prodígio Elemental [Raiton]']],['Ramificação · B',['• Força Bruta','• Velocidade Elevada','• Reflexos Elevados','• Maestria em Taijutsu','• Maestria em Ninjutsu','• Maestria em Fūinjutsu','• Maestria em Bukijutsu [Kenjutsu]','• Chakra Elevado','• Vitalidade Anormal','• Akurobatto [Chuunin]']]]},
'cla-jugo':{n:'Clã jūugo 🎭',d:'Integrantes de histórico problemático, poderosos e completamente psicopatas. Têm uma genética abençoada que absorve energia natural de forma passiva e permite ativar um modo chamado “Senninka”.',s:[['Habilidades',['• Força Bruta','• Reflexo elevado','• Resistência elevada','• Maestria Taijutsu','• Chakra Elevado','• Controle de Chakra','• Controle de vigor','• Vigor elevado','• Transformação Eremita']],['Transformação Eremita',['Com a absorção de grandes quantidades de energia natural, o corpo muda para uma aparência monstruosa: pode ter membros extras, absorver membros alheios para se regenerar ou transformá-los em armas e propulsores. Os atributos físicos também aumentam.']],['Senninka · Forma Parcial',['O usuário sofre dano mental passivo pela grande quantidade de energia natural. Surgem marcas no corpo e a performance física aumenta.','• Nível: 150 (cena de 25 linhas durante três dias para despertar)','• Atributos: 3.0x','• Manipulação de energia natural','• Duração: 4 turnos | 2 turnos (reativar)']],['Senninka · Forma Definitiva',['Mudança física horrenda, com perda dos traços de humanidade e do controle do próprio corpo pelo cérebro. A imagem fica semelhante a um ser demoníaco, manipulando livremente a matéria orgânica, com atributos ainda maiores.','• Nível: 350 (cena de 35 linhas durante cinco dias para evoluir)','• Atributos: 6.0x','• Manipulação de energia natural','• Duração: 6 turnos | 3 turnos (reativar)']]]}
,'cla-kazekage':{n:'Kazekage ⌛',d:'A linhagem desse clã é ligada diretamente ao próprio Kazekage, herdando parte de suas habilidades, uma genialidade incomum e talento nato nas suas especialidades. O clã pode ser variado, mas a linhagem primogênita carrega a poderosa e versátil hiden.',s:[['Habilidades',['• Reflexo Elevado','• Maestria em Ninjutsu [3x]','• Chakra Elevado','• Controle de Chakra','• Fragilidade [Resistência ÷2]','• H.D: [Sorteio 2/5, Areia, Areia de Ferro e Pó de Ouro]']],['Ramificação · Temari',['• Velocidade Elevada','• Reflexo Elevado','• Maestria em Ninjutsu','• Maestria em Bukijutsu','• Controle de Chakra','• Prodígio Elemental [Fuuton]','• Genialidade']],['Ramificação · Kankuro',['• Força Elevada','• Resistência Elevada','• Controle de Chakra','• Maestria em Bukijutsu','• Maestria em Venenos','• Resistência a venenos','• Ferreiro','• Titereiro']]]},
'cla-terumi':{n:'Clã Terumi 🌋',d:'Família geneticamente abençoada com duas kekkei genkai no mesmo organismo, que podem ser combinadas para criar um estilo de luta próprio. Normalmente do sexo feminino, são dotadas e naturalmente habilidosas em ninjutsu.',s:[['Habilidades',['• Velocidade Elevada','• Maestria em Ninjutsu','• Maestria em Selos','• Maestria Elemental','• Controle de Chakra','• Chakra Elevado','• K.K.G: Youton [Jounin]','• K.K.G: Futton [Chunnin]']],['Kekkei Genkai · Estilo Dissolução',['Kekkei genkai avançada de complementos desconhecidos: expele grandes quantidades de ácido capaz de derreter o próprio chakra do alvo. É fatal, mas dificilmente controlado.']],['Kekkei Genkai · Estilo Ebulição',['Interligado ao estilo anterior, expele um gás corrosivo capaz de derreter tudo em seu alcance. Une os elementos fogo e água para formar técnicas de vapor, que corroem chakra como o estilo dissolução.']]]},
'cla-yuki':{n:'Clã Yuki ❄️',d:'Famosa descendência histórica de Kirigakure, esquecida com o tempo e as guerras, o que tornou sua genética unicamente rara. É caracterizado pela kekkei genkai do estilo gelo, uma poderosa habilidade vangloriada mundo afora.',s:[['Habilidades',['• Reflexo Elevado','• Maestria Elemental','• Maestria em Selos','• Maestria em Ninjutsu','• Maestria em Bukijutsu','• Fragilidade [Resistência ÷2]','• K.K.G: Hyōton']],['Kekkei Genkai · Estilo Gelo',['Rara kekkei genkai avançada que combina água e vento. Pode ser usada em armas, escudos ou para fortificar os próprios punhos com gelo, aumentando a força e a resistência física.']]]}
,'cla-yamanaka':{n:'Clã Yamanaka 🍑',d:'Os Yamanaka fazem parte do sistema sensorial da grande barreira de Konoha, com um papel crucial na defesa da aldeia. São conhecidos por deter técnicas capazes de destruir a mente de seus alvos.',s:[['Habilidades',['• Reflexo Elevado','• Maestria em Ninjutsu','• Maestria em Selos','• Controle de Chakra','• Chakra Elevado','• H.D: Shintenshin no Jutsu','• Kanchi Taipu [Nível 2.0]']]]},
'cla-aburame':{n:'Clã Aburame 🐜',d:'Os Aburame são ninjas que abrigam insetos em sua própria estrutura interna. Eles firmam um pacto com esses insetos e os utilizam em seus experimentos e técnicas.',s:[['Habilidades',['• Maestria em Ninjutsu','• Controle de Chakra','• Chakra Elevado','• Conhecimento Científico','• H.D: Kikaichū no Jutsu','• Rinkaichū [1/4]','• Genialidade']]]},
'cla-sai':{n:'Clã Sai 🎨',d:'Essa família é uma curiosidade sem origem conhecida: seus integrantes são extremamente pálidos e antipáticos com as emoções humanas, mas detêm uma habilidade relacionada à arte.',s:[['Habilidades',['• Velocidade Elevada','• Maestria em Ninjutsu','• Maestria em Bukijutsu','• Maestria em Fūinjutsu','• Pergaminho da Super Besta [Estilo de Luta]','• Genialidade']]]},
'cla-orochi':{n:'Clã Orochimaru 🐍',d:'Família com genética muito propensa a talentos científicos, associada ao dom “Genialidade”. Seus membros têm aparência pálida e magra, com traços de uma serpente branca.',s:[['Habilidades',['• Velocidade Elevada','• Maestria em Ninjutsu','• Maestria Elemental','• Maestria em Fūinjutsu','• Maestria em Selos','• Conhecimento Científico','• Conhecimento Médico','• Características Animalescas [Cobra]','• Genialidade']]]}
,'cla-hozuki':{n:'Clã Hozuki 💧',d:'Descendentes dos espadachins da névoa, são portadores de uma kekkei genkai incomum, em que o estilo de luta se resume a manipular os inimigos “de dentro pra fora”.',s:[['Habilidades',['• Força Bruta','• Velocidade Elevada','• Reflexo Elevado','• Maestria em Bukijutsu [Kenjutsu]','• Chakra Elevado','• Controle de Chakra','• Liquefação Corpórea [Chuunin]']]]},
'cla-bakurei':{n:'Clã Bakurei 💥',d:'Linhagem de usuários de uma kekkei genkai incomum em Iwagakure, especialistas em explosões e em lutas de longo alcance. Possuem uma genialidade natural para estratégia em combate, tendo conhecimento de cada informação específica no campo de batalha.',s:[['Habilidades',['• Maestria em Selos','• Maestria Elemental','• Maestria em Ninjutsu [3x]','• Chakra Elevado','• Controle de Chakra','• Sentidos Apurados [Visão]','• K.K.G: Bakuton [Chuunin]']],['Kekkei Genkai · Estilo Explosão',['Kekkei genkai transmitida dentro de Iwagakure, composta pela natureza terra e associada ao selo cobra. O usuário utiliza chakra explosivo em combate, podendo explodir objetos com os quais entra em contato ou produzir explosivos de argila acionados remotamente. Por conter a natureza terra, o estilo explosão é automaticamente neutralizado pela natureza raio.']]]},
'cla-kurotsuchi':{n:'Clã Kurotsuchi 💨',d:'Têm origem em Iwagakure e possuem uma kekkei genkai conhecida por sua complexidade e variedade. Embora tenham pouco conhecimento por conta própria, destacam-se em suporte, defesa e ataque.',s:[['Habilidades',['• Força Bruta','• Reflexo Elevado','• Maestria em Taijutsu','• Maestria em Bukijutsu [Kenjutsu]','• Maestria em Genjutsu','• Maestria Elemental','• K.K.G: Youton [Chuunin]']],['Kekkei Genkai · Estilo Fusão',['Ultrapassa o limite do avançado e permite combinar elementos como lava, borracha, chamas, cinzas e pó de cal. Todos os estilos pertencem a uma única kekkei genkai, o que torna o combate variado e incomum.']]]},
'cla-mu':{n:'Clã Mū 🎲',d:'Tem origem em Iwagakure e, assim como a linhagem principal, faz parte da herança genética dos Tsuchikage. Possui uma das raras kekkei genkai de três naturezas, chamada Touta, que supera a limitação de usar apenas dois elementos ao mesmo tempo.',s:[['Habilidades',['• Reflexo Elevado','• Maestria Elemental','• Maestria em Ninjutsu [3.0x]','• Controle de Chakra','• Prodígio Elemental [Doton]','• K.K.G: Jinton [Tokubetsu]','• Kanchi Taipu']],['Kekkei Genkai · Touta',['Combina as naturezas Terra, Vento e Fogo. Seu poder destrutivo é quase absoluto, pois sua função principal é desintegrar, em nível molecular, qualquer matéria que entre em seu domínio. É ativada por um único selo que forma uma figura geométrica, a qual se expande em diferentes tamanhos e proporções ao redor de um ou mais alvos.']]]}
,'cla-chinoike':{n:'Clã Chinoike 🩸',d:'O clã Chinoike é uma família originalmente de Kumogakure, caçada e quase extinta por suas habilidades e pela kekkei genkai conhecida como “olhos de sangue do dragão”.',s:[['Habilidades',['• Maestria em Ninjutsu','• Maestria em Bukijutsu','• Maestria em Genjutsu','• Chakra Elevado','• Controle de Chakra','• Controle de Sangue [Chuunin]','• Dōjutsu: Ketsuryūgan','• Sangue extra [5x]']],['Kekkei Genkai · Ketsuryūgan',['Dōjutsu ocular que aprimora as técnicas à base de sangue, funcionando a partir do controle refinado da composição sanguínea. Esse controle só pode ser feito a partir do próprio sangue, podendo introduzi-lo na corrente sanguínea do alvo ou misturá-lo a algum líquido para aumentar as reservas das técnicas maiores. Também é conhecido pelo genjutsu poderoso, que causa efeitos reais nas ilusões e pode até combater um usuário do sharingan.']],['Ketsuryūgan · 1ª fase',['• Ninjutsu: 1.75x','• Genjutsu: 2.0x','• Gasto: 50pts p/ turno','• Nível: 150 (executar um turno de 25 linhas)','• Habilidades: lançar genjutsu, ninjutsu aprimorado']],['Ketsuryūgan · 2ª fase',['• Ninjutsu: 2.0x','• Genjutsu: 3.0x','• Nível: 300 (executar um turno de 35 linhas)','• Habilidades: lançar genjutsu, ninjutsu aprimorado']],['Ketsuryūgan · 3ª fase',['• Ninjutsu: 3.0x','• Genjutsu: 4.0x','• Nível: 600 (executar um turno de 45 linhas)','• Habilidades: lançar genjutsu, ninjutsu aprimorado, controlar sangue']]]}
,'cla-hiruko':{n:'Clã Hiruko ⛓️',d:'Linhagem de cientistas que originalmente não porta kekkei genkai alguma, mas que, com o avanço das pesquisas, desenvolveu a sua própria. Ela é totalmente desconhecida por qualquer informação do mundo ninja, sendo um completo mistério.',s:[['Habilidades',['• Maestria em Bukijutsu','• Chakra Elevado','• Conhecimento Científico','• K.K.G: Meiton [Chuunin]','• K.K.G: Kouton [Jounin]','• Kimera no Jutsu [Hanchou]','• Fragilidade [Resistência ÷2]','• Genialidade']],['Kekkei Genkai · Estilo Escuridão',['Kekkei genkai de composição totalmente desconhecida, capaz de absorver, manipular e moldar chakra livremente com uma marca na palma da mão. Absorve técnicas e usa o mesmo chakra para devolvê-las ao criador, e a técnica da quimera é capaz de absorver a kekkei genkai de outras pessoas. Porém, isso custa a integridade física, diminuindo a resistência a cada kekkei genkai absorvida.']]]}
,'cla-guren':{n:'Clã Guren 💎',d:'O clã Guren teve a genética alterada por experimentos, criando uma linhagem portadora de uma kekkei genkai que virou “lenda” no mundo ninja. Possuem pouquíssimos integrantes, mas compensam a ausência com habilidade natural.',s:[['Habilidades',['• Maestria em Ninjutsu','• Maestria em Selos','• Maestria Elemental','• Controle de Chakra','• Chakra Elevado','• Pontos de pressão de dor e morte [Chuunin]','• K.K.G: Shouton [Jounin]']],['Kekkei Genkai · Estilo Cristal',['Kekkei genkai avançada composta pela natureza terra, capaz de criar e manipular a formação de cristais a partir de técnicas avançadas. Por ser composta pela natureza terra, sua principal fraqueza é a natureza raio.']]]}
,'cla-konan':{n:'Clã Konan 🧻',d:'O clã Konan é originalmente de Amegakure, uma aldeia oculta localizada em um país desconhecido. Possui um estilo único de luta, adicionando chakra a materiais inóspitos para auxiliar no campo de batalha.',s:[['Habilidades',['• Reflexo Elevado','• Maestria em Ninjutsu','• Maestria em Selos','• Maestria em Shurikenjutsu','• Kanchi Taipu','• Controle de Chakra','• Kami Ninpou [Estilo de Luta]']]]}
};

["Hanchou",["Os ninjas que chegam ao extremo nível de poder são chamados de “hanchou”, aqueles que alcançam o auge de sua habilidade. Normalmente são os gênios de sua geração, com mérito no mundo todo, e deixam sua marca na história do mundo ninja.","• Requisito: Nível 3.000","• Requisito: ter mérito o suficiente"]]

var MIS=[
["Regras gerais",["Todo shinobi pode executar duas missões diárias inicialmente, passando a somente missões narradas ao atingir o nível Jounin de Elite. Cada aldeia oculta tem seu próprio método de missões, mas todas seguem o padrão de patentes shinobi."]],
["Missões rank D — C",["Não representam perigo algum, como “resgatar um pet” ou “afazeres domésticos”, normalmente feitas por ninjas com pouca experiência (Gennin). Podem ser executadas duas vezes por dia e devem ter no mínimo 15 linhas / 150 palavras por missão.","• Recompensa C: +4 nível & +4.000¥","• Recompensa D: +2 nível & +2.000¥"]],
["Missões rank C — B",["Representam um perigo intermediário, executadas por ninjas de média experiência (Chunnin). Vão de um simples “resgate” a “prender algum meliante” que tenha conhecimento em jutsu. Podem ser executadas somente uma por dia e devem ter no mínimo 25 linhas / 250 palavras cada.","• Recompensa: +10 nível & +10.000¥"]],
["Missões rank A — S+",["Só podem ser executadas por ninjas de alta experiência de combate e estratégia (Jounin), como “assassinatos” de criminosos ou “invasões” de lugares nitidamente perigosos. Só na presença de uma narração, e devem ser cumpridas em qualquer ocasião. Quanto mais ninjas forem convocados, mais perigosa é a missão.","• Recompensa A: +25 nível & +25.000¥","• Recompensa S+: +35 nível & +35.000¥"]],
["Missões rank S+ — SS+",["Têm risco absoluto de morte, enfrentando uma ameaça de nível global ou planetária. São executadas raramente por quem faz seu nome no mundo ninja (Jounin de Elite), somente na presença de um narrador, normalmente com ganhos únicos.","• Recompensa: +45 nível & +45.000¥"]],
["Missões especiais",["Objetivos únicos que podem variar de rank conforme suas ações, sempre na presença de uma narração com diversos personagens. Os ganhos são incertos, pois a ameaça pode equivaler a um simples trabalho de gennin ou à caça de indivíduos de rank S+."]],
["Missão extra",["Exceção entre as missões de alto nível: não precisa de narração, e sim de o personagem executar uma missão voltada ao seu desenvolvimento, de um resgate simples ao desenvolvimento da história. Só pode ser executada uma vez ao mês e deve ter no mínimo 200 linhas / 2.000 palavras.","• Recompensa: mín. 50 — máx. 100 nível","• Recompensa: mín. 50.000¥ — máx. 150.000¥"]]

["Força",["Responsável por sobrepor, puxar ou empurrar objetos e alvos. Combate diretamente a resistência física do alvo, sendo crucial para quem usa taijutsu como especialidade, podendo quebrar barreiras de chakra ou estruturas inteiras. Também responde pelo arremesso de objetos.","• 20pts = 1kg"]],
["Velocidade",["A velocidade de movimento e deslocamento define sua destreza do ponto A ao ponto B. Sempre precisa de reflexo para ser usada por completo, sendo o principal atributo em ataques rápidos.","• 20pts = 1km/h"]],
["Reflexo",["O reflexo corporal e mental define sua rapidez ao pensar, responder e esquivar de ataques. Define a “mentalidade” do personagem no conceito estratégico, concedendo a capacidade de pensar rápido e agir conforme os instintos. Se o reflexo for 100% superior à velocidade de ataque do oponente, o corpo pode agir automaticamente para desviar. Reflexo e velocidade trabalham em conjunto no deslocamento: é preciso que o reflexo seja pelo menos 65% da velocidade para usá-la ao máximo sem risco de perder o controle.","• 20pts = 2m/s de percepção"]],
["Resistência",["O atributo mais crucial no combate físico ou armado, definindo sua stamina, quanto dano físico suporta e sua integridade. Se o atributo usado pelo oponente for ridiculamente superior, a chance de morte é inevitável.","• 20pts = 2kg em resistência"]],
["Ninjutsu",["Define tudo que envolve técnicas à base de chakra, sendo a base da potência e da velocidade das suas técnicas. Define os atributos da técnica e também, além do ninjutsu, genjutsu, kenjutsu, shurikenjutsu etc., definindo sua “habilidade” em algumas especialidades, como a destreza com o kenjutsu e o controle sobre a lâmina."]],
["Selos",["Servem para manipular e ordenar o fluxo de chakra ao executar qualquer técnica, aprimorando a velocidade nesse quesito. A partir de 5.000pts em selos, o ninja pode executar técnicas um rank abaixo com apenas uma mão.","• 20pts = 2m/s de velocidade"]],
["Chakra",["A energia que percorre o fluxo de chakra, cuja fonte pode ser localizada no estômago, peito ou cérebro. Comanda toda ação que o necessita; quando afetado por alguma ilusão tende a ficar confuso, o que facilita perceber ilusão, doença ou sentimento negativo. Pode ser treinado para expandir as reservas e tem especialidades únicas com chakra especial."]]

function secPg(t,intro,d){
  return '<h1>'+t+'</h1>'+(intro?'<p class="mu">'+intro+'</p>':'')+d.map(function(s){
    return '<h2>'+s[0]+'</h2><div class="c"><span>'+s[1].map(esc).join('<br>')+'</span></div>'}).join('')}
function clanPg(c){return '<p><a href="#clas">← Todos os clãs</a></p><h1>'+c.n+'</h1><p class="mu">'+esc(c.d)+'</p>'+c.s.map(function(s){return '<h2>'+s[0]+'</h2><div class="c"><span>'+s[1].map(esc).join('<br>')+'</span></div>'}).join('')}
function route(){
  var p=(location.hash||"#inicio").slice(1);
  var cp=CL[p];if(!cp&&["inicio","clas","habilidades","patentes","missoes","treinos","atributos"].indexOf(p)<0)p="inicio";
  nav(cp?"clas":p);
  var a=document.getElementById("app");
  a.innerHTML=cp?clanPg(cp):p==="clas"?clasPg():p==="habilidades"?habPg():p==="patentes"?secPg("🔰 Patentes","As patentes shinobi são as classes que diferem seu nível de poder, capacidade e rank por um sistema evolutivo, designadas por nível e mérito adquirido em missões. Cada patente é superior à anterior e deve seguir as ordens de um superior.",PAT):p==="missoes"?secPg("🔰 Missões","As missões são designadas a quem se formou na academia ninja e passou a fazer parte da força de sua aldeia, respeitando o nível de poder de cada patente, de uma simples missão rank D a uma rank SS+.",MIS):p==="treinos"?secPg("🔰 Treinos","Os treinos fazem parte da evolução de um ninja para se adaptar e aprimorar suas habilidades em combate, com variados tipos de treinamento para focar no seu principal tributo, seja um prodígio em genjutsu ou alguém que só usa taijutsu.",TRE):p==="atributos"?secPg("🔰 Atributos","",ATR):inicio();
  var q=document.getElementById("q");
  if(p==="clas"){clasList("");q.oninput=function(){clasList(norm(q.value.trim()))}}
  if(p==="habilidades"){habList("");q.oninput=function(){habList(norm(q.value.trim()))}}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
